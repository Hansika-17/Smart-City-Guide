<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Details</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="container">

        <h1>Hotel Details</h1>

        <div id="hotelDetails"></div>

        <br>

        <a href="hotels.html">
            <button>Back to Hotels</button>
        </a>

    </div>

    <script>

        const params = new URLSearchParams(window.location.search);

        const id = params.get("id");

        fetch("http://localhost:8080/api/hotels/" + id)

        .then(response => response.json())

        .then(hotel => {

            document.getElementById("hotelDetails").innerHTML = `

                <div class="card">

                    <h2>${hotel.hotelName}</h2>

                    <p><b>City:</b> ${hotel.city}</p>

                    <p><b>Address:</b> ${hotel.address}</p>

                    <p><b>Description:</b> ${hotel.description}</p>

                    <p><b>Contact:</b> ${hotel.contactNumber}</p>

                    <p><b>Email:</b> ${hotel.email}</p>

                    <p><b>Rating:</b> ${hotel.rating}</p>

                    <p><b>Category:</b> ${hotel.category}</p>

                </div>

            `;

        });

    </script>

</body>

</html>
