<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Restaurant Details</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <div class="container">

        <h1>Restaurant Details</h1>

        <div id="restaurantDetails"></div>

        <br>

        <a href="restaurants.html">
            <button>Back to Restaurants</button>
        </a>

    </div>

    <script>

        const params = new URLSearchParams(window.location.search);

        const id = params.get("id");

        fetch("http://localhost:8080/api/restaurants/" + id)

        .then(response => response.json())

        .then(restaurant => {

            document.getElementById("restaurantDetails").innerHTML = `

                <div class="card">

                    <img src="${restaurant.imageUrl}" width="300">

                    <h2>${restaurant.restaurantName}</h2>

                    <p><b>City:</b> ${restaurant.city}</p>

                    <p><b>Address:</b> ${restaurant.address}</p>

                    <p><b>Description:</b> ${restaurant.description}</p>

                    <p><b>Contact:</b> ${restaurant.contactNumber}</p>

                    <p><b>Email:</b> ${restaurant.email}</p>

                    <p><b>Cuisine:</b> ${restaurant.cuisine}</p>

                    <p><b>Rating:</b> ${restaurant.rating}</p>

                </div>

            `;

        });

    </script>

</body>

</html>
