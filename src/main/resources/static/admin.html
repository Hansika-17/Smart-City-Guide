<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Panel</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="container">

<h1>Admin Panel</h1>

<h2>Add Hotel</h2>

<input type="text" id="hotelName" placeholder="Hotel Name"><br><br>

<input type="text" id="city" placeholder="City"><br><br>

<input type="text" id="address" placeholder="Address"><br><br>

<input type="text" id="description" placeholder="Description"><br><br>

<input type="text" id="contactNumber" placeholder="Contact Number"><br><br>

<input type="email" id="email" placeholder="Email"><br><br>

<input type="text" id="imageUrl" placeholder="Image URL"><br><br>

<input type="number" step="0.1" id="rating" placeholder="Rating"><br><br>

<input type="text" id="category" placeholder="Category"><br><br>

<button onclick="addHotel()">

Add Hotel

</button>

<hr>

<h2>Delete Hotel</h2>

<input type="number"
       id="deleteHotelId"
       placeholder="Hotel ID">

<button onclick="deleteHotel()">

Delete Hotel

</button>

<hr>

<h2>Update Hotel</h2>

<input type="number" id="updateId" placeholder="Hotel ID"><br><br>

<input type="text" id="updateHotelName" placeholder="Hotel Name"><br><br>

<input type="text" id="updateCity" placeholder="City"><br><br>

<input type="text" id="updateAddress" placeholder="Address"><br><br>

<input type="text" id="updateDescription" placeholder="Description"><br><br>

<input type="text" id="updateContactNumber" placeholder="Contact Number"><br><br>

<input type="email" id="updateEmail" placeholder="Email"><br><br>

<input type="text" id="updateImageUrl" placeholder="Image URL"><br><br>

<input type="number" step="0.1" id="updateRating" placeholder="Rating"><br><br>

<input type="text" id="updateCategory" placeholder="Category"><br><br>

<button onclick="updateHotel()">
Update Hotel
</button>

<br><br>

<hr>

<h2>Add Restaurant</h2>

<input type="text" id="restaurantName" placeholder="Restaurant Name"><br><br>

<input type="text" id="restaurantCity" placeholder="City"><br><br>

<input type="text" id="restaurantAddress" placeholder="Address"><br><br>

<input type="text" id="restaurantDescription" placeholder="Description"><br><br>

<input type="text" id="restaurantContactNumber" placeholder="Contact Number"><br><br>

<input type="email" id="restaurantEmail" placeholder="Email"><br><br>

<input type="text" id="restaurantImageUrl" placeholder="Image URL"><br><br>

<input type="number" step="0.1" id="restaurantRating" placeholder="Rating"><br><br>

<input type="text" id="restaurantCuisine" placeholder="Cuisine"><br><br>

<button onclick="addRestaurant()">
Add Restaurant
</button>

<hr>

<h2>Delete Restaurant</h2>

<input type="number" id="deleteRestaurantId" placeholder="Restaurant ID"><br><br>

<button onclick="deleteRestaurant()">
Delete Restaurant
</button>

<hr>

<h2>Update Restaurant</h2>

<input type="number" id="updateRestaurantId" placeholder="Restaurant ID"><br><br>

<input type="text" id="updateRestaurantName" placeholder="Restaurant Name"><br><br>

<input type="text" id="updateRestaurantCity" placeholder="City"><br><br>

<input type="text" id="updateRestaurantAddress" placeholder="Address"><br><br>

<input type="text" id="updateRestaurantDescription" placeholder="Description"><br><br>

<input type="text" id="updateRestaurantContactNumber" placeholder="Contact Number"><br><br>

<input type="email" id="updateRestaurantEmail" placeholder="Email"><br><br>

<input type="text" id="updateRestaurantImageUrl" placeholder="Image URL"><br><br>

<input type="number" step="0.1" id="updateRestaurantRating" placeholder="Rating"><br><br>

<input type="text" id="updateRestaurantCuisine" placeholder="Cuisine"><br><br>

<button onclick="updateRestaurant()">
Update Restaurant
</button>

<br><br>

<a href="index.html">

<button>

Back Home

</button>

</a>

</div>

<script src="js/admin.js"></script>

</body>

</html>
